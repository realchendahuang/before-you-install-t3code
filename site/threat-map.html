      --text-muted: #8b949e;
      --accent: #58a6ff;

      --sev-critical-bg: rgba(248, 81, 73, 0.14);
      --sev-high: #fb8500;
      --sev-high-bg: rgba(251, 133, 0, 0.14);
      --sev-med: #e3b341;
      --sev-med-bg: rgba(227, 179, 65, 0.14);

      --st-open: #ff7b72;
      --st-open-bg: rgba(248, 81, 73, 0.16);
      --st-partial: #58a6ff;
      --st-partial-bg: rgba(88, 166, 255, 0.16);

      --edge-default: #30363d;
      --edge-dim: rgba(48, 54, 61, 0.35);
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    [data-theme="light"] {
      --bg: #f6f8fa;
      --surface: #ffffff;
      --surface-2: #f0f3f6;
      --border: #d0d7de;
      --text: #1f2328;
      --text-muted: #59636e;
      --accent: #0969da;

      --sev-critical: #cf222e;
      --sev-critical-bg: rgba(207, 34, 46, 0.1);
      --sev-high: #bc4c00;
      --sev-high-bg: rgba(188, 76, 0, 0.1);
      --sev-med: #9a6700;
      --sev-med-bg: rgba(154, 103, 0, 0.12);

      --st-open: #cf222e;
      --st-open-bg: rgba(207, 34, 46, 0.1);
      --st-partial: #0969da;
      --st-partial-bg: rgba(9, 105, 218, 0.1);

      --edge-dim: rgba(197, 206, 216, 0.35);
      --shadow: 0 6px 20px rgba(31, 35, 40, 0.08);

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      line-height: 1.55;
    }

    .app {
      max-width: 1440px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 16px;
    }

    .title-block h1 {
      margin: 0 0 6px 0;
      font-size: 21px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .subtitle {
      margin: 0;
      font-size: 13px;
      color: var(--text-muted);
    }

    .subtitle code {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 6px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      color: var(--text);
    }

    .stats-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .stat-chip {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .stat-chip strong {
      font-size: 14px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 16px;
    }

    .filter-groups {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 18px;
    }

    .filter-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .filter-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-right: 4px;
    }

    .btn {
      appearance: none;
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 11px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn:hover {
      border-color: var(--accent);
    }

    .btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }

    .btn-ghost {
      background: transparent;
    }

    .action-btns {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1.85fr) minmax(320px, 1fr);
      gap: 16px;
      align-items: start;
    }

    @media (max-width: 1080px) {
      .workspace {
        grid-template-columns: 1fr;
      }
    }

    .canvas-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      box-shadow: var(--shadow);
      overflow-x: auto;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 4px 6px 10px 6px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 8px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .legend-items {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      align-items: center;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    svg#threat-map {
      width: 100%;
      min-width: 780px;
      height: auto;
      display: block;
      user-select: none;
    }

    .edge {
      fill: none;
      stroke: var(--edge-default);
      stroke-width: 1.8;
      transition: stroke 0.2s ease, stroke-width 0.2s ease, opacity 0.2s ease;
    }

    .edge.dimmed {
      stroke: var(--edge-dim);
      opacity: 0.35;
    }

    .edge.highlighted {
      stroke-width: 2.8;
      opacity: 1;
    }

    .node-group {
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .node-group.dimmed {
      opacity: 0.26;
    }

    .node-group:focus {
      outline: none;
    }

    .node-bg {
      fill: var(--surface-2);
      stroke: var(--border);
      stroke-width: 1.2;
      transition: stroke 0.18s ease, stroke-width 0.18s ease, fill 0.18s ease;
    }

    .node-group:hover .node-bg {
      stroke: var(--accent);
      stroke-width: 1.8;
    }

    .node-group.selected .node-bg {
      stroke: var(--accent);
      stroke-width: 2.2;
    }

    .node-title {
      fill: var(--text);
      font-size: 12.5px;
      font-weight: 600;
    }

    .node-sub {
      fill: var(--text-muted);
      font-size: 11px;
    }

    .root-bg {
      fill: var(--surface-2);
      stroke: var(--sev-critical);
      stroke-width: 2;
    }

    .inspector {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      box-shadow: var(--shadow);
      position: sticky;
      top: 16px;
    }

    .inspector-header {
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
      margin-bottom: 14px;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 8px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      border: 1px solid transparent;
    }

    .badge-sev-严重 {
      color: var(--sev-critical);
      background: var(--sev-critical-bg);
      border-color: rgba(248, 81, 73, 0.35);
    }

    .badge-sev-高危 {
      color: var(--sev-high);
      background: var(--sev-high-bg);
      border-color: rgba(251, 133, 0, 0.35);
    }

    .badge-sev-中高危 {
      color: var(--sev-med);
      background: var(--sev-med-bg);
      border-color: rgba(227, 179, 65, 0.35);
    }

    .badge-st-仍未修复 {
      color: var(--st-open);
      background: var(--st-open-bg);
    }

    .badge-st-部分修复 {
      color: var(--st-partial);
      background: var(--st-partial-bg);
    }

    .badge-domain {
      color: var(--text-muted);
      background: var(--surface-2);
      border-color: var(--border);
    }

    .inspector h2 {
      margin: 0;
      font-size: 17px;
      line-height: 1.35;
    }

    .detail-section {
      margin-bottom: 14px;
    }

    .detail-section:last-child {
      margin-bottom: 0;
    }

    .detail-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      margin-bottom: 5px;

    .detail-text {
      margin: 0;
      font-size: 13.5px;
      color: var(--text);
    }

    .evidence-list {

      flex-wrap: wrap;
      gap: 6px;
      margin-top: 4px;
    }

    .evidence-tag {
      display: inline-block;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11.5px;
      padding: 3px 7px;
      border-radius: 5px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--accent);
      text-decoration: none;
    }

    a.evidence-tag:hover {
      border-color: var(--accent);
      text-decoration: underline;
    }

    span.evidence-tag {
      color: var(--text);
    }

    .mitigation-box {
      background: var(--surface-2);
      border-left: 3px solid var(--accent);
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 13px;
    }

    .child-links {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 6px;
    }

    .child-link-btn {
      text-align: left;
      width: 100%;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      color: var(--text);
      font-size: 12.5px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .child-link-btn:hover {
      border-color: var(--accent);
    }

    footer {

      padding-top: 12px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 8px;
    }

    footer a {
      color: var(--accent);
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>

      function el(tag, attrs, parent) {
        const node = document.createElementNS(svgNS, tag);
        if (attrs) {
          for (const [k, v] of Object.entries(attrs)) {
            node.setAttribute(k, String(v));
          }
        }
        if (parent) parent.appendChild(node);
        return node;
      }

      function computeLayout() {
        const leafStartY = 26;
        const leafH = 48;
        const leafGap = 12;
        const leafX = 528;
        const leafW = 408;

        const domainX = 256;
        const domainW = 216;
        const domainH = 54;

        const rootX = 22;
        const rootW = 180;
        const rootH = 104;

        const leafPos = {};
        THREATS.forEach((t, idx) => {
          const y = leafStartY + idx * (leafH + leafGap);
          leafPos[t.id] = { x: leafX, y, w: leafW, h: leafH, cy: y + leafH / 2 };
        });

        const domainPos = {};
        DOMAINS.forEach((d) => {
          const children = THREATS.filter((t) => t.domainId === d.id);
          const first = leafPos[children[0].id];
          const last = leafPos[children[children.length - 1].id];
          const cy = (first.cy + last.cy) / 2;
          domainPos[d.id] = { x: domainX, y: cy - domainH / 2, w: domainW, h: domainH, cy };
        });

        const rootCy = 380;
        const rootPos = { x: rootX, y: rootCy - rootH / 2, w: rootW, h: rootH, cy: rootCy };

        return { rootPos, domainPos, leafPos };
      }

      const layout = computeLayout();

      function matchesFilter(threat) {
        const sevOk = state.severity === "全部" || threat.severity === state.severity;
        const stOk = state.status === "全部" || threat.status === state.status;
        return sevOk && stOk;
      }

      function getHighlightedSet() {
        const activeId = state.hoveredId || state.selectedId;
        const nodes = new Set();
        const edges = new Set();
        if (!activeId) return { nodes, edges };

        if (activeId === "root") {
          nodes.add("root");
          DOMAINS.forEach((d) => {
            const matchedChildren = THREATS.filter((t) => t.domainId === d.id && matchesFilter(t));
            if (matchedChildren.length > 0) {
              nodes.add(d.id);
              edges.add("root->" + d.id);
              matchedChildren.forEach((t) => {
                nodes.add(t.id);
                edges.add(d.id + "->" + t.id);
              });
            }
          });
          return { nodes, edges };
        }

        const domain = DOMAINS.find((d) => d.id === activeId);
        if (domain) {
          nodes.add("root");
          nodes.add(domain.id);
          edges.add("root->" + domain.id);
          THREATS.filter((t) => t.domainId === domain.id && matchesFilter(t)).forEach((t) => {
            nodes.add(t.id);
            edges.add(domain.id + "->" + t.id);
          });
          return { nodes, edges };
        }

        const threat = THREATS.find((t) => t.id === activeId);
        if (threat) {
          nodes.add("root");
          nodes.add(threat.domainId);
          nodes.add(threat.id);
          edges.add("root->" + threat.domainId);
          edges.add(threat.domainId + "->" + threat.id);
        }
        return { nodes, edges };
      }

      function bezierPath(x1, y1, x2, y2) {
        const dx = (x2 - x1) * 0.52;
        return `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`;
      }

          { color: "var(--st-partial)", label: "部分修复", val: partialCount },
          { color: "var(--accent)", label: "风险总计", val: total }
        ];
        items.forEach((it) => {
          const div = document.createElement("div");
          div.className = "stat-chip";
          const dot = document.createElement("span");
          dot.className = "dot";
          dot.style.background = it.color;
          const strong = document.createElement("strong");
          strong.textContent = it.val;
          const span = document.createElement("span");
          span.textContent = it.label;
          div.append(dot, strong, span);
          statsBar.appendChild(div);
        });
      }

      function renderDiagram() {

        matchCounter.textContent = `当前命中：${matchedThreats.length} / ${THREATS.length} 项风险`;

        const hl = getHighlightedSet();
        const edgeLayer = el("g", { id: "edges" }, svg);
        const nodeLayer = el("g", { id: "nodes" }, svg);

        // Root -> Domains edges
        DOMAINS.forEach((d) => {
          const p1 = layout.rootPos;
          const p2 = layout.domainPos[d.id];
          const edgeKey = "root->" + d.id;
          const isMatched = matchedDomainIds.has(d.id);
          const isHl = hl.edges.has(edgeKey);
          const path = el(
            "path",
            {
              d: bezierPath(p1.x + p1.w, p1.cy, p2.x, p2.cy),
              class: "edge" + (!isMatched ? " dimmed" : "") + (isHl ? " highlighted" : "")
            },
            edgeLayer
          );
          if (isHl) path.style.stroke = SEV_COLORS[d.severity];
        });

        // Domains -> Threats edges
        THREATS.forEach((t) => {
          const p1 = layout.domainPos[t.domainId];
          const p2 = layout.leafPos[t.id];

              class: "edge" + (!isMatched ? " dimmed" : "") + (isHl ? " highlighted" : "")
            },
            edgeLayer
          );
          if (isHl) path.style.stroke = SEV_COLORS[t.severity];
        });

            nodeLayer
          );
          el("rect", { x: dp.x, y: dp.y, width: dp.w, height: dp.h, rx: 9, class: "node-bg" }, g);
          el("rect", { x: dp.x, y: dp.y, width: 5, height: dp.h, rx: 2, fill: SEV_COLORS[d.severity] }, g);

          const txt = el("text", { x: dp.x + 15, y: dp.y + 24, class: "node-title" }, g);
          txt.textContent = d.title;

          const sub = el("text", { x: dp.x + 15, y: dp.y + 42, class: "node-sub" }, g);
          sub.textContent = `${d.severity} · ${d.dossier} · ${count}/${totalInDomain} 项`;

          bindNodeEvents(g, d.id);
        });

        // Threat leaf nodes
        THREATS.forEach((t) => {
          const lp = layout.leafPos[t.id];
          const isMatched = matchedIds.has(t.id);
          const g = el(
            "g",
            {
              class: "node-group" + (!isMatched ? " dimmed" : "") + (state.selectedId === t.id ? " selected" : ""),
              tabindex: "0",
              role: "button",
              "aria-label": t.title
            },
            nodeLayer
          );
          el("rect", { x: lp.x, y: lp.y, width: lp.w, height: lp.h, rx: 8, class: "node-bg" }, g);
          el("rect", { x: lp.x, y: lp.y, width: 5, height: lp.h, rx: 2, fill: SEV_COLORS[t.severity] }, g);

          const txt = el("text", { x: lp.x + 14, y: lp.y + 21, class: "node-title" }, g);
          txt.textContent = t.title;

          const sub = el("text", { x: lp.x + 14, y: lp.y + 38, class: "node-sub" }, g);
          sub.textContent = t.evidence.slice(0, 3).map((e) => e.label).join(" · ");

          // Status pill
          const pillW = 66;
          const pillH = 22;
          const pillX = lp.x + lp.w - pillW - 10;
          const pillY = lp.y + (lp.h - pillH) / 2;
          const isOpen = t.status === "仍未修复";
          el(
            "rect",
            {
              x: pillX,
              y: pillY,
              width: pillW,
              height: pillH,
              rx: 11,
              fill: isOpen ? "var(--st-open-bg)" : "var(--st-partial-bg)"
            },
            g
          );
          const pillTxt = el(
            "text",
            {
              x: pillX + pillW / 2,
              y: pillY + 14.5,
              "text-anchor": "middle",
              style: `font-size:10.5px;font-weight:600;fill:${isOpen ? "var(--st-open)" : "var(--st-partial)"}`
            },
            g
          );
          pillTxt.textContent = t.status;

          bindNodeEvents(g, t.id);
        });
      }

      function bindNodeEvents(g, id) {
        g.addEventListener("mouseenter", () => {
          state.hoveredId = id;
          renderDiagram();
        });
        g.addEventListener("mouseleave", () => {
          state.hoveredId = null;
          renderDiagram();
        });
        g.addEventListener("click", () => {
          state.selectedId = id;
          renderDiagram();
          renderInspector();
        });
        g.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            state.selectedId = id;
            renderDiagram();
            renderInspector();
          }
        });
      }

      function createBadge(text, cls) {
        const s = document.createElement("span");
        s.className = "badge " + cls;
        s.textContent = text;
        return s;
      }

      function renderInspector() {
        inspector.innerHTML = "";
        const id = state.selectedId;

        if (id === "root") {
          renderDetailView({
            title: ROOT_NODE.title + "（总览）",
            badges: [
              { text: ROOT_NODE.severity, cls: "badge-sev-严重" },
              { text: "主干核心风险仍生效", cls: "badge-st-仍未修复" },
              { text: ROOT_NODE.meta, cls: "badge-domain" }
            ],
            impact: ROOT_NODE.impact,
            affected: ROOT_NODE.affected,
            evidence: ROOT_NODE.evidence,
            mitigation: ROOT_NODE.mitigation
          });
          return;
        }

        const domain = DOMAINS.find((d) => d.id === id);
        if (domain) {
          const children = THREATS.filter((t) => t.domainId === domain.id);
          const header = document.createElement("div");
          header.className = "inspector-header";
          const badges = document.createElement("div");
          badges.className = "badges";
          badges.append(
            createBadge(domain.severity, "badge-sev-" + domain.severity),
            createBadge(domain.dossier, "badge-domain"),
            createBadge(`包含 ${children.length} 项风险`, "badge-domain")
          );
          const h2 = document.createElement("h2");
          h2.textContent = domain.title;
          header.append(badges, h2);
          inspector.appendChild(header);

          const sec1 = document.createElement("div");
          sec1.className = "detail-section";
          sec1.innerHTML = '<div class="detail-label">风险域概述</div>';
          const p = document.createElement("p");
          p.className = "detail-text";
          p.textContent = domain.summary;
          sec1.appendChild(p);
          inspector.appendChild(sec1);

          const sec2 = document.createElement("div");
          sec2.className = "detail-section";
          sec2.innerHTML = '<div class="detail-label">下属具体危害节点（点击切入详情）</div>';
          const list = document.createElement("div");
          list.className = "child-links";
          children.forEach((c) => {
            const btn = document.createElement("button");
            btn.className = "child-link-btn";
            const left = document.createElement("span");
            left.textContent = c.title;
            const right = createBadge(c.status, "badge-st-" + c.status);
            btn.append(left, right);
            btn.addEventListener("click", () => {
              state.selectedId = c.id;
              renderDiagram();
              renderInspector();
            });
            list.appendChild(btn);
          });
          sec2.appendChild(list);
          inspector.appendChild(sec2);
          return;
        }

        const threat = THREATS.find((t) => t.id === id) || THREATS[0];
        const parentDomain = DOMAINS.find((d) => d.id === threat.domainId);
        renderDetailView({
          title: threat.title,
          badges: [
            { text: threat.severity, cls: "badge-sev-" + threat.severity },
            { text: threat.status, cls: "badge-st-" + threat.status },
            { text: parentDomain ? parentDomain.title : "", cls: "badge-domain" }
          ],
          impact: threat.impact,
          affected: threat.affected,
          evidence: threat.evidence,
          mitigation: threat.mitigation
        });
      }

      function renderDetailView(data) {
        const header = document.createElement("div");
        header.className = "inspector-header";
        const badges = document.createElement("div");
        badges.className = "badges";
        data.badges.forEach((b) => badges.appendChild(createBadge(b.text, b.cls)));
        const h2 = document.createElement("h2");
        h2.textContent = data.title;
        header.append(badges, h2);
        inspector.appendChild(header);

        const sections = [
          { label: "实际危害与技术事实", text: data.impact },
          { label: "受影响人群", text: data.affected }
        ];
        sections.forEach((s) => {
          const sec = document.createElement("div");
          sec.className = "detail-section";
          const lbl = document.createElement("div");
          lbl.className = "detail-label";
          lbl.textContent = s.label;
          const p = document.createElement("p");
          p.className = "detail-text";
          p.textContent = s.text;
          sec.append(lbl, p);
          inspector.appendChild(sec);
        });

        const evSec = document.createElement("div");
        evSec.className = "detail-section";
        const evLbl = document.createElement("div");
        evLbl.className = "detail-label";
        evLbl.textContent = "一手源码 / PR / Issue 证据";
        const evList = document.createElement("div");
        evList.className = "evidence-list";
        data.evidence.forEach((ev) => {
          if (ev.url) {
            const a = document.createElement("a");
            a.className = "evidence-tag";
            a.href = ev.url;
            a.target = "_blank";
            a.rel = "noopener noreferrer";
            a.textContent = ev.label + " ↗";
            evList.appendChild(a);
          } else {
            const sp = document.createElement("span");
            sp.className = "evidence-tag";
            sp.textContent = ev.label;
            evList.appendChild(sp);
          }
        });
        evSec.append(evLbl, evList);
        inspector.appendChild(evSec);

        const mitSec = document.createElement("div");
        mitSec.className = "detail-section";
        const mitLbl = document.createElement("div");
        mitLbl.className = "detail-label";
        mitLbl.textContent = "止损与应对建议";
        const box = document.createElement("div");
        box.className = "mitigation-box";
        box.textContent = data.mitigation;
        mitSec.append(mitLbl, box);
        inspector.appendChild(mitSec);
      }

      // Bind filter buttons
      document.querySelectorAll("#severity-filters .btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          document.querySelectorAll("#severity-filters .btn").forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          state.severity = btn.dataset.val;
          renderDiagram();
        });
      });

      document.querySelectorAll("#status-filters .btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          document.querySelectorAll("#status-filters .btn").forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          state.status = btn.dataset.val;
          renderDiagram();
        });
      });

      document.getElementById("reset-btn").addEventListener("click", () => {
        state.severity = "全部";
        state.status = "全部";
        state.selectedId = "root";
        state.hoveredId = null;
        document.querySelectorAll("#severity-filters .btn, #status-filters .btn").forEach((b) => {
          b.classList.toggle("active", b.dataset.val === "全部");
        });
        renderDiagram();
        renderInspector();
      });

      const themeBtn = document.getElementById("theme-btn");
      themeBtn.addEventListener("click", () => {
        const html = document.documentElement;
        const next = html.getAttribute("data-theme") === "dark" ? "light" : "dark";
        html.setAttribute("data-theme", next);
        themeBtn.textContent = next === "dark" ? "切换浅色" : "切换深色";
      });

      renderStats();
      renderDiagram();
      renderInspector();
    })();
  </script>
</body>
</html>
