name: Translation Fix
description: Report a translation error, broken relative link, or suggested text improvement for an edition under docs/i18n/.
title: "[i18n]: "
labels:
  - i18n
body:
  - type: markdown
    attributes:
      value: |
        Thank you for improving our 18-language documentation tree! Please ensure all external `https://` URLs from `README.md` are preserved verbatim and avoid `\$` or `==highlight==` Markdown artifacts (see [CONTRIBUTING.md](https://github.com/realchendahuang/before-you-install-t3code/blob/main/CONTRIBUTING.md)).
  - type: dropdown
    id: language-edition
    attributes:
      label: Language Edition under docs/i18n/
      description: Select the translation file (or root README.md) affected by this issue.
      options:
        - docs/i18n/README.zh-CN.md
        - docs/i18n/README.zh-TW.md
        - docs/i18n/README.fr.md
        - docs/i18n/README.es.md
        - docs/i18n/README.ru.md
        - docs/i18n/README.ar.md
        - docs/i18n/README.ja.md
        - docs/i18n/README.ko.md
        - docs/i18n/README.de.md
        - docs/i18n/README.pt-BR.md
        - docs/i18n/README.it.md
        - docs/i18n/README.nl.md
        - docs/i18n/README.pl.md
        - docs/i18n/README.tr.md
        - docs/i18n/README.vi.md
        - docs/i18n/README.id.md
        - docs/i18n/README.hi.md
        - README.md (English reference)
    validations:
      required: true
  - type: textarea
    id: issue-suggested-text
    attributes:
      label: Issue / Suggested Text
      description: Specify the section heading or line numbers, explain the translation/formatting issue, and paste the suggested replacement text.
      placeholder: |
        - Section / Line: ...
        - Current text: ...
        - Suggested text: ...
    validations:
      required: true
  - type: checkboxes
    id: parity-check
    attributes:
      label: URL & Link Parity
      options:
        - label: My suggested change preserves every canonical https:// URL and relative evidence/dossier link verbatim.
          required: true
